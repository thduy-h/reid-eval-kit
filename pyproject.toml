[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reid-eval-kit"
version = "0.1.0"
description = "Reproducible CPU evaluation for embedding-based person re-identification"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "reid-eval-kit contributors"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
yaml = ["pyyaml>=6"]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy", "build", "twine", "pyyaml>=6", "types-PyYAML"]

[dependency-groups]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy", "build", "twine", "pyyaml>=6", "types-PyYAML"]

[project.scripts]
reideval = "reid_eval_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

